[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sealedloop"
version = "0.1.0"
description = "Sequential keep-or-roll-back test for self-improving embodied policies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["sealedloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
